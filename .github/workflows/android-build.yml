name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36.1 build-tools;36.0.0'

      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Write .env.local from repository variables
        run: |
          cat > .env.local <<'EOF'
          VITE_NETEASE_API_BASE=${{ vars.NETEASE_API_BASE || '' }}
          VITE_KUGOU_API_BASE=${{ vars.KUGOU_API_BASE || '' }}
          VITE_FOLIA_API_BASE=${{ vars.FOLIA_API_BASE || '' }}
          EOF

      - name: npm ci
        run: npm ci

      - name: Build web bundle and sync Capacitor
        run: npm run cap:sync:android

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tianfu-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare release signing
        if: secrets.KEYSTORE_BASE64 != ''
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/tianfu-release.jks
          cat > android/keystore.properties <<EOF
          storeFile=tianfu-release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Assemble release APK
        if: secrets.KEYSTORE_BASE64 != ''
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload release APK
        if: secrets.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: tianfu-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
