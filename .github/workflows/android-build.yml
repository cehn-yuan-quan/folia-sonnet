name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle with cache
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36.1 build-tools;36.0.0'

      - name: Accept SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Write .env.local (server addresses; repository Variables override)
        run: |
          printf 'VITE_NETEASE_API_BASE=%s\n' '${{ vars.NETEASE_API_BASE || 'http://193.112.22.155:18080/netease' }}' > .env.local
          printf 'VITE_KUGOU_API_BASE=%s\n' '${{ vars.KUGOU_API_BASE || 'http://193.112.22.155:18080/kugou' }}' >> .env.local
          printf 'VITE_FOLIA_API_BASE=%s\n' '${{ vars.FOLIA_API_BASE || 'http://193.112.22.155:18080/api' }}' >> .env.local

      - name: npm ci
        run: npm ci

      - name: Build web bundle and sync Capacitor
        run: npm run cap:sync:android

      - name: Assemble debug APK
        working-directory: android
        run: bash gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tianfu-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare release signing
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            printf '%s' "$KS_B64" | base64 -d > android/tianfu-release.jks
            printf 'storeFile=tianfu-release.jks\n' > android/keystore.properties
            printf 'storePassword=%s\n' "$KS_PASS" >> android/keystore.properties
            printf 'keyAlias=%s\n' "$KS_ALIAS" >> android/keystore.properties
            printf 'keyPassword=%s\n' "$KS_KEYPASS" >> android/keystore.properties
          fi

      - name: Assemble release APK
        working-directory: android
        run: bash gradlew --no-daemon assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: tianfu-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
